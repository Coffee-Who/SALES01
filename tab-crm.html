<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>實威國際 CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans TC',sans-serif;background:#f4f5f8}

#topbar{
  background:#1a1a2e;height:52px;display:flex;align-items:center;
  padding:0 20px;gap:10px;
}
.logo-box{width:28px;height:28px;background:#2563eb;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#fff}
.logo-name{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:#fff}
.logo-sep{width:1px;height:14px;background:rgba(255,255,255,.25);margin:0 4px}
#page-subtitle{font-size:11px;color:rgba(255,255,255,.45)}
.tr{margin-left:auto;display:flex;align-items:center;gap:8px}
.v-tag{font-size:10px;color:rgba(255,255,255,.35);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:3px 8px;border-radius:4px}

#navtab{
  background:#fff;border-bottom:1px solid #d0d7de;
  display:flex;padding:0 16px;
}
.ntab{
  padding:12px 18px;font-size:13px;font-weight:500;color:#656d76;
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s;
}
.ntab:hover{color:#1f2328}
.ntab.on{color:#2563eb;border-bottom-color:#2563eb}

/* iframe 容器：固定在 topbar+navtab 下方，撐滿剩餘空間 */
#frame-wrap{
  position:fixed;top:104px;left:0;right:0;bottom:0;overflow:hidden;
}

/* CRM iframe：同域，不需裁切 */
#iframe-crm{
  width:100%;height:100%;border:none;display:block;
}

/* 客戶開發 iframe：跨域，用 margin-top 將內部 topbar+navtab 推出可視區 */
/* 內部 topbar ≈ 52px, navtab ≈ 44px → 共約 96px，取整數 -96px */
.email-clip{
  position:absolute;inset:0;overflow:hidden;
}
#iframe-email{
  width:100%;
  height:calc(100% + 96px);  /* 補回被推上去的高度 */
  margin-top:-96px;           /* 往上移，把內部 topbar+navtab 推出可視範圍 */
  border:none;display:block;
}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo-box">SW</div>
  <span class="logo-name">實威國際</span>
  <div class="logo-sep"></div>
  <span id="page-subtitle">CRM 客戶管理</span>
  <div class="tr"><span class="v-tag">v3.0</span></div>
</div>

<div id="navtab">
  <div class="ntab on" id="tab-crm" onclick="switchTab('crm')">🧑‍💼 CRM</div>
  <div class="ntab" id="tab-email" onclick="switchTab('email')">📧 客戶開發</div>
</div>

<div id="frame-wrap">
  <!-- CRM：同域 iframe，內部已用 JS 隱藏本身的 topbar/navtab -->
  <iframe id="iframe-crm" src="tab-crm-inner.html" title="CRM"
    style="width:100%;height:100%;border:none;display:block"></iframe>

  <!-- 客戶開發：跨域，用 clip+margin-top 裁掉上方 96px -->
  <div class="email-clip" id="email-clip" style="display:none">
    <iframe id="iframe-email"
      src="https://coffee-who.github.io/SALES01/tab-customer-email.html"
      title="客戶開發"></iframe>
  </div>
</div>

<script>
function switchTab(key){
  var isCrm = key === 'crm';
  document.getElementById('iframe-crm').style.display  = isCrm ? 'block' : 'none';
  document.getElementById('email-clip').style.display  = isCrm ? 'none'  : 'block';
  document.getElementById('tab-crm').classList.toggle('on',  isCrm);
  document.getElementById('tab-email').classList.toggle('on', !isCrm);
  document.getElementById('page-subtitle').textContent = isCrm ? 'CRM 客戶管理' : '客戶開發';
}
</script>
</body>
</html>
